[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "client-rag-api"
version = "0.1.0"
description = "API RAG multi-negocio: clientes, documentos y chat aislados por business_id."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "pypdf>=5.1",
    "python-multipart>=0.0.12",
    "chromadb>=0.5",
    "openai>=1.55",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
mint-token = "app.mint_token:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
